appId: fr.sicdangbe.jarvis
productName: Jarvis
copyright: Copyright 2026 sicDANGBE et contributeurs (MIT)
afterPack: scripts/after-pack-linux-launcher.cjs
electronVersion: 37.10.3

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  # The pnpm collector drops this nested version in the hoisted layout.
  # Keep retry 0.12 for Pi's lockfile code; other consumers require root 0.13.
  - from: ../../node_modules/proper-lockfile/node_modules/retry
    to: node_modules/proper-lockfile/node_modules/retry
    filter:
      - "**/*"
  # The collector nests the newer SSO under Bedrock. Its token provider must
  # stay below SSO: Bedrock itself pins a different token-provider version.
  - from: ../../node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    to: node_modules/@aws-sdk/client-bedrock-runtime/node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    filter:
      - "**/*"

extraResources:
  - from: resources/pi-subagent-launcher.cjs
    to: pi-subagent-launcher.cjs
  - from: resources/apply-fork-update.ps1
    to: apply-fork-update.ps1
  - from: resources/icon.png
    to: icon.png
  - from: resources/linux/apparmor-jarvis
    to: linux/apparmor-jarvis

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/.pnpm/node-pty*/node_modules/node-pty/**/*"

artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: true
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  darkModeSupport: true
  extraFiles:
    - from: build/native/jarvis-notification-status-helper
      to: MacOS/jarvis-notification-status-helper

linux:
  category: Office
  executableName: jarvis
  # electron-builder writes "Exec=AppRun --no-sandbox %U" when this list is empty, which would
  # disable the Chromium sandbox for every desktop launch (issue #12). This neutral marker takes
  # its place; the "jarvis" launcher removes it and decides on the sandbox itself.
  executableArgs:
    - --jarvis-desktop-entry
  artifactName: jarvis-${version}-${arch}.${ext}
  maintainer: sicDANGBE <86024465+sicDANGBE@users.noreply.github.com>
  vendor: Jarvis
  synopsis: Assistant IA de bureau de l'agence
  description: Assistant IA de bureau basé sur l'agent Pi, configuré et sécurisé par l'agence.
  target:
    - target: AppImage
      arch:
        - x64

deb:
  artifactName: ${productName}_${version}_${arch}.${ext}
  packageName: jarvis
  packageCategory: devel
  priority: optional
  afterRemove: resources/linux/after-remove.sh
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
    - libgbm1

win:
  executableName: jarvis
  # Keep icon/version metadata editing; signing is optional without credentials.
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

toolsets:
  appimage: "1.0.2"

dmg:
  sign: true
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

publish:
  provider: github
  owner: sicDANGBE
  repo: jarvis
